# 本地部署覆盖：控制开发机的 JVM 内存占用。
# 256MB 初始堆避免 Docker 启动后立即占用过多内存；1GB 最大堆足以支持
# 当前单机开发和模拟验证，容器仍保留额外空间给元数据、线程栈和本地库。
services:
  oe.openelis.org:
    environment:
      CATALINA_OPTS: "-Xms256m -Xmx1024m -Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Ddatasource.password=clinlims -Doe.ssl.truststorepath=/etc/openelis-global/truststore -Doe.ssl.truststorepassword=tspass -Doe.ssl.keystorepath=/etc/openelis-global/keystore -Doe.ssl.keystorepassword=kspass"
