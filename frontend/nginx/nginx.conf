server {
    listen 80;
    server_name _;

    # Compress JS/CSS/JSON at the origin: built Vite bundles are multi-MB and
    # were previously shipped uncompressed through the proxy layer. The proxy
    # forwards the Content-Encoding untouched, so compression applies once.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    # The application shell must always be revalidated. Otherwise a login
    # redirect back to `/` can reuse an older index.html that points at stale
    # hashed bundles after a local rebuild.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # Vite fingerprints built assets, so these files are safe to cache.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }
}
