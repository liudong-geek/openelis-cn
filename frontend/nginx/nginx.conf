server {
    listen 80;
    server_name _;

    # The application shell must always be revalidated. Otherwise a login
    # redirect back to `/` can reuse an older index.html that points at stale
    # hashed bundles after a local rebuild.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # Vite fingerprints built assets, so these files are safe to cache.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }
}
