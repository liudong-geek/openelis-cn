worker_processes 1;

events { worker_connections 1024; }

http {
    server {
        listen [::]:80;
        listen 80;
        server_name _;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # This China-local profile is published as host port 18080. Preserve
        # that public port so Spring/Tomcat never redirects a browser to :80.
        proxy_set_header X-Forwarded-Port 18080;
        proxy_set_header Host $http_host;

        absolute_redirect off;

        # Baseline browser protections for the local delivery endpoint.  The
        # application still needs inline Carbon styles and the legacy
        # calculated-value evaluator, so keep those two capabilities explicit
        # rather than falling back to an unrestricted policy.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; connect-src 'self' ws: wss:; frame-src 'self' data: blob:; worker-src 'self' blob:; media-src 'self' data: blob:" always;

        location / {
            # Keep the local HTTP endpoint stable across Docker/Desktop restarts.
            # Resolving the service name only at nginx startup leaves nginx with
            # a stale container address when the frontend is recreated.
            proxy_pass http://172.26.1.122:80;
            proxy_redirect off;
        }

        location /api/ {
            # Use the fixed address reserved for the source-built webapp.  Resolving
            # oe.openelis.org during proxy startup can otherwise fall through to
            # public DNS while the container is still being created.
            proxy_pass https://172.26.1.121:8443/api/;

            # The WAR declares every application route CONFIDENTIAL. The local
            # edge-to-Tomcat hop is already TLS, so present that hop as secure to
            # prevent Tomcat from redirecting the browser back to HTTPS. Any
            # absolute application redirect is adapted to the public HTTP debug
            # origin below.
            proxy_redirect ~^https://[^/]+(/.*)$ http://$http_host$1;

            # The upstream application runs over TLS internally and therefore
            # marks JSESSIONID as Secure with an /OpenELIS-Global path.  This
            # local debugging endpoint is intentionally HTTP and is exposed as
            # /api/OpenELIS-Global, so adapt the cookie for that browser origin.
            proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;
            proxy_cookie_flags JSESSIONID nosecure samesite=lax;
            proxy_hide_header Strict-Transport-Security;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 18080;
        }
    }
}
