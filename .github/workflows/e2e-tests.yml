# The privileged wrapper reads GitHub metadata and trusted policy only.
# Same-repository code uses the existing full executor. Cross-repository code
# is never checked out, published or executed here and receives a failed gate.
name: E2E / Tests

on:
  workflow_run:
    workflows: ["03 - E2E"]
    types: [completed]

concurrency:
  group: e2e-tests-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  setup:
    name: E2E Context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      execution_mode: ${{ steps.context.outputs.execution_mode }}
      reason: ${{ steps.context.outputs.reason }}
      is_fork: ${{ steps.context.outputs.is_fork }}
      pr_number: ${{ steps.context.outputs.pr_number }}
      checkout_ref: ${{ steps.context.outputs.checkout_ref }}
      status_sha: ${{ steps.source.outputs.status_sha }}
      build_run_id: ${{ steps.context.outputs.build_run_id }}
      artifact_source_mode: ${{ steps.context.outputs.artifact_source_mode }}
      artifact_map_kind: ${{ steps.context.outputs.artifact_map_kind }}
      include_plugin_jars: ${{ steps.context.outputs.include_plugin_jars }}
      checkpoint_context: ${{ steps.context.outputs.checkpoint_context }}
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/ci/e2e-context.cjs
          sparse-checkout-cone-mode: false

      - name: Verify source and independently classify PR paths
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const {resolveSource} = require('./.github/ci/e2e-context.cjs');
            const plan = await resolveSource({github, context});
            fs.writeFileSync('/tmp/e2e-source-plan.json', JSON.stringify(plan));
            core.setOutput('status_sha', plan.status_sha);
            core.setOutput('execution_mode', plan.execution_mode);
            core.setOutput('scope', plan.scope);

      - name: Download early build context artifact
        if: steps.source.outputs.execution_mode == 'verify-context'
        id: download_context
        uses: actions/download-artifact@v6
        with:
          name: e2e-build-context-core
          path: /tmp/e2e-build-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download transfer-state artifact
        if: steps.source.outputs.execution_mode == 'verify-context' && steps.source.outputs.scope == 'full'
        id: download_transfer
        uses: actions/download-artifact@v6
        with:
          name: e2e-build-transfer-state
          path: /tmp/e2e-transfer-state
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify build context and transfer
        id: context
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const {verifyBuildContext} = require('./.github/ci/e2e-context.cjs');
            const source = JSON.parse(fs.readFileSync('/tmp/e2e-source-plan.json', 'utf8'));
            const read = (path) => {
              try { return fs.readFileSync(path, 'utf8').trim(); }
              catch { return undefined; }
            };
            const metadata = Object.fromEntries(
              ['event_name', 'head_sha', 'is_fork', 'pr_number', 'pr_sha', 'base_sha']
                .map(name => [name, read(`/tmp/e2e-build-context/${name}`)])
            );
            const plan = verifyBuildContext(source, metadata, read('/tmp/e2e-transfer-state/image_transfer'));
            for (const [name, value] of Object.entries(plan)) core.setOutput(name, value);
            await core.summary.addRaw(plan.reason).write();

  set-pending-status:
    name: Set Pending Status
    needs: setup
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post checkpoint status
        uses: actions/github-script@v8
        env:
          STATUS_SHA: ${{ needs.setup.outputs.status_sha || github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.STATUS_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error('Invalid source SHA');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, state: 'pending', context: '03 Checkpoint - E2E',
              description: 'Verifying E2E scope and results...',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  authoritative-executor:
    name: Authoritative E2E Executor
    needs: setup
    if: needs.setup.outputs.execution_mode == 'full' && needs.setup.outputs.is_fork == 'false'
    uses: ./.github/workflows/e2e-authoritative-reusable.yml
    permissions:
      contents: read
      packages: read
      actions: read
    with:
      checkout_ref: ${{ needs.setup.outputs.checkout_ref }}
      status_sha: ${{ needs.setup.outputs.status_sha }}
      build_run_id: ${{ needs.setup.outputs.build_run_id }}
      artifact_source_mode: ${{ needs.setup.outputs.artifact_source_mode }}
      artifact_map_kind: ${{ needs.setup.outputs.artifact_map_kind }}
      include_plugin_jars: ${{ needs.setup.outputs.include_plugin_jars }}
      is_fork: ${{ needs.setup.outputs.is_fork }}
      pr_number: ${{ needs.setup.outputs.pr_number }}
      checkpoint_context: ${{ needs.setup.outputs.checkpoint_context }}
      test_user: ${{ vars.TEST_USER || 'admin' }}
      test_pass: ${{ vars.TEST_PASS || 'adminADMIN!' }}

  e2e-gate:
    name: E2E Gate
    if: always()
    needs: [setup, authoritative-executor]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ steps.gate.outputs.state }}
      description: ${{ steps.gate.outputs.description }}
    steps:
      - name: Checkout trusted gate policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/ci/e2e-context.cjs
          sparse-checkout-cone-mode: false

      - name: Enforce E2E results
        id: gate
        uses: actions/github-script@v8
        env:
          EXECUTION_MODE: ${{ needs.setup.outputs.execution_mode }}
          BLOCK_REASON: ${{ needs.setup.outputs.reason }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SETUP_RESULT: ${{ needs.setup.result }}
          EXECUTOR_RESULT: ${{ needs.authoritative-executor.result }}
        with:
          script: |
            const {checkpointOutcome} = require('./.github/ci/e2e-context.cjs');
            const result = checkpointOutcome({
              mode: process.env.EXECUTION_MODE, reason: process.env.BLOCK_REASON,
              conclusion: process.env.BUILD_CONCLUSION, setup: process.env.SETUP_RESULT,
              executor: process.env.EXECUTOR_RESULT,
            });
            core.setOutput('state', result.state);
            core.setOutput('description', result.description);
            if (result.state !== 'success') core.setFailed(result.description);
            else core.info(result.description);

  report-status:
    name: Report Status
    if: always()
    needs: [setup, set-pending-status, e2e-gate]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Update checkpoint status
        uses: actions/github-script@v8
        env:
          STATUS_SHA: ${{ needs.setup.outputs.status_sha || github.event.workflow_run.head_sha }}
          GATE_STATE: ${{ needs.e2e-gate.outputs.state }}
          GATE_RESULT: ${{ needs.e2e-gate.result }}
          GATE_DESCRIPTION: ${{ needs.e2e-gate.outputs.description }}
        with:
          script: |
            const sha = process.env.STATUS_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error('Invalid source SHA');
            const passed = process.env.GATE_RESULT === 'success' && process.env.GATE_STATE === 'success';
            const state = passed ? 'success' : process.env.GATE_RESULT === 'cancelled' || process.env.GATE_STATE === 'error' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha, state, context: '03 Checkpoint - E2E',
              description: (process.env.GATE_DESCRIPTION || 'E2E gate did not complete successfully').slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
